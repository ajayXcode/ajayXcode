<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GitHub Profile Cards Preview — Ajay Yadav (@ajayXcode)</title>
  <style>
    body {
      background-color: #0d1117;
      color: #c9d1d9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .readme-container {
      max-width: 860px;
      width: 100%;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 32px;
      box-sizing: border-box;
    }
    .cards-stack {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 100%;
    }
    .cards-stack img {
      display: block;
      width: 100%;
      height: auto;
    }
    .tiles-row {
      display: flex;
      justify-content: space-between;
      width: 100%;
    }
    .tiles-row a {
      width: 32.5%;
      display: block;
    }
    .tiles-row img {
      width: 100%;
      height: auto;
    }
    .mode-bar {
      margin-bottom: 24px;
      padding: 10px 18px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .mode-btn {
      background: #8b5cf6;
      color: white;
      border: none;
      padding: 6px 14px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
    }
    .mode-btn:hover {
      background: #7c3aed;
    }
  </style>
</head>
<body>
  <div class="mode-bar">
    <span>🎨 <strong>Stack Preview:</strong> GitHub Profile Cards</span>
    <span style="color:#8b949e">•</span>
    <span>Match: <strong>Portfolio Palette &amp; Mona Sans</strong></span>
    <span style="color:#8b949e">•</span>
    <span>Motion: <strong>Staggered CSS Keyframes &amp; SMIL</strong></span>
  </div>

  <div class="readme-container">
    <div class="cards-stack">
      <!-- 1. Hero -->
      <div>
        <img src="cards/hero.svg" alt="Hero Card" />
      </div>

      <!-- 2. Three Linked Tiles (32.5% each) -->
      <div class="tiles-row">
        <a href="https://portfolio-tau-rouge-710zivsk3i.vercel.app/" target="_blank">
          <img src="cards/tile-portfolio.svg" alt="Portfolio Tile" />
        </a>
        <a href="https://github.com/ajayXcode?tab=repositories" target="_blank">
          <img src="cards/tile-projects.svg" alt="Projects Tile" />
        </a>
        <a href="https://www.linkedin.com/in/ajay-yadav-2o26/" target="_blank">
          <img src="cards/tile-connect.svg" alt="Connect Tile" />
        </a>
      </div>

      <!-- 3. Contributions Chart -->
      <div>
        <img src="cards/contributions-chart.svg" alt="Contributions Chart Card" />
      </div>

      <!-- 4. Featured Repos -->
      <a href="https://github.com/ajayXcode/Octavia" target="_blank" style="text-decoration:none;">
        <img src="cards/repo-octavia.svg" alt="Octavia Repo Card" />
      </a>
      <a href="https://github.com/ajayXcode/Echo" target="_blank" style="text-decoration:none;">
        <img src="cards/repo-echo.svg" alt="Echo Repo Card" />
      </a>
      <a href="https://github.com/ajay-rgb/Drone-Swarm-Coordination-Simulator" target="_blank" style="text-decoration:none;">
        <img src="cards/repo-drone-swarm-coordination-simulator.svg" alt="Drone Swarm Simulator Repo Card" />
      </a>
      <a href="https://github.com/ajay-rgb/Inko" target="_blank" style="text-decoration:none;">
        <img src="cards/repo-inko.svg" alt="Inko Repo Card" />
      </a>

      <!-- 5. Contribution Graph -->
      <div>
        <img src="cards/contribution-graph.svg" alt="Contribution Graph Card" />
      </div>
    </div>
  </div>
</body>
</html>
